services:
  interview-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cv-interview-bot
    ports:
      - "8501:8501"
    volumes:
      - ./data/resumes:/app/data/resumes
      - ./data/vector_db:/app/data/vector_db
      - ./outputs:/app/outputs
      - ./src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    command: python src/server.py
    networks:
      - interview-network
    restart: unless-stopped

networks:
  interview-network:
    driver: bridge
