<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI Resume Interview Bot{% endblock %}</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #09101f;
        --surface: rgba(18, 32, 57, 0.92);
        --surface-strong: rgba(255, 255, 255, 0.08);
        --text: #eef2ff;
        --muted: #9bb0d9;
        --accent: #5b8cff;
        --accent-soft: rgba(91, 140, 255, 0.18);
        --border: rgba(255, 255, 255, 0.11);
        --shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top left, rgba(91, 140, 255, 0.18), transparent 28%),
                    radial-gradient(circle at bottom right, rgba(70, 250, 183, 0.12), transparent 24%),
                    linear-gradient(180deg, #06101b 0%, #0f1f3b 100%);
        color: var(--text);
      }

      .page-shell {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .hero {
        padding: 48px 24px 24px;
        text-align: center;
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(2.5rem, 3.5vw, 4rem);
        letter-spacing: -0.05em;
      }

      .hero p {
        margin: 18px auto 0;
        max-width: 760px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.8;
      }

      .container {
        width: min(100%, 980px);
        margin: 0 auto;
        padding: 0 18px 42px;
        flex: 1;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        border-radius: 28px;
        padding: 32px;
        backdrop-filter: blur(18px);
      }

      .form-group {
        display: grid;
        gap: 10px;
        margin-bottom: 22px;
      }

      label {
        color: var(--muted);
        font-size: 0.95rem;
        font-weight: 600;
      }

      input[type=file], select, textarea {
        width: 100%;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255,255,255,0.04);
        color: var(--text);
        padding: 14px 16px;
        font-size: 1rem;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      select, textarea {
        appearance: none;
      }

      input[type=file]::-webkit-file-upload-button {
        border: none;
        background: var(--accent);
        color: white;
        padding: 10px 16px;
        border-radius: 14px;
        cursor: pointer;
      }

      input[type=file]::-moz-file-upload-button {
        border: none;
        background: var(--accent);
        color: white;
        padding: 10px 16px;
        border-radius: 14px;
        cursor: pointer;
      }

      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: rgba(91, 140, 255, 0.95);
        box-shadow: 0 0 0 3px rgba(91, 140, 255, 0.14);
      }

      button {
        border: none;
        border-radius: 16px;
        padding: 14px 22px;
        font-size: 1rem;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(135deg, #5b8cff, #08d8b7);
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 18px 32px rgba(43, 109, 255, 0.26);
      }

      .button-secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid rgba(255,255,255,0.16);
      }

      .button-secondary:hover {
        background: rgba(255,255,255,0.04);
      }

      .question-card {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        padding: 26px;
        margin-bottom: 20px;
      }

      .question-card p {
        margin: 0 0 16px;
        line-height: 1.75;
      }

      .question-card h2 {
        margin: 0 0 8px;
        font-size: 1.05rem;
      }

      textarea {
        min-height: 150px;
        resize: vertical;
      }

      .note {
        color: var(--muted);
        font-size: 0.95rem;
        margin-top: 8px;
      }

      .footer {
        padding: 18px 24px;
        text-align: center;
        color: rgba(255,255,255,0.55);
        font-size: 0.95rem;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .top-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 18px;
      }

      @media (max-width: 720px) {
        .card {
          padding: 24px;
        }

        .hero {
          padding: 34px 18px 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <h1>AI Resume Interview Bot</h1>
        <p>Generate interview questions from your resume, practice answers, and receive AI-powered feedback in one polished workflow.</p>
      </header>

      <main class="container">
        <div class="card">
          {% block content %}{% endblock %}
        </div>
      </main>

      <footer class="footer">Designed for faster interview prep.</footer>
    </div>
  </body>
</html>
