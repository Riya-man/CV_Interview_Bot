{% extends 'base.html' %}

{% block title %}Select Category{% endblock %}

{% block content %}
  <h2>Choose a new question category</h2>
  <p class="note">Resume <strong>{{ resume_name }}</strong> is ready to use.</p>

  <form action="/generate" method="post">
    <div class="form-group">
      <label for="category">Question Type</label>
      <select id="category" name="category" required>
        {% for c in categories %}
          <option value="{{ c }}">{{ c }}</option>
        {% endfor %}
      </select>
    </div>

    <button type="submit">Generate Questions</button>
  </form>

  <a class="button-secondary top-link" href="/">← Back</a>
{% endblock %}
